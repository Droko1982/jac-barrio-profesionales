<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" role="img" aria-labelledby="sello-t">
  <title id="sello-t">Sello de la Junta de Acción Comunal Barrio Los Profesionales, Armenia, Quindío</title>
  <defs>
    <clipPath id="s-disco"><circle cx="160" cy="138" r="96"/></clipPath>
    <linearGradient id="s-cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#29B6F6"/>
      <stop offset="0.45" stop-color="#B3E5FC"/>
      <stop offset="0.8" stop-color="#FFE0B2"/>
    </linearGradient>
    <radialGradient id="s-sol" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF8E1"/>
      <stop offset="0.55" stop-color="#FFD54F"/>
      <stop offset="1" stop-color="#FFB300"/>
    </radialGradient>
    <linearGradient id="s-aro" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E7D32"/>
      <stop offset="1" stop-color="#1B5E20"/>
    </linearGradient>
    <linearGradient id="s-cinta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E53935"/>
      <stop offset="1" stop-color="#B71C1C"/>
    </linearGradient>
    <path id="s-arriba" d="M 54 138 A 106 106 0 0 1 266 138"/>
    <path id="s-cinta-texto" d="M 44 248 Q 160 278 276 248"/>
    <!-- hoja de café -->
    <path id="s-hoja" d="M0 0 C6 -6.5 16 -6.5 23 0 C16 6.5 6 6.5 0 0 Z"/>
    <!-- racimo de cerezas de café -->
    <g id="s-cerezas">
      <circle cx="0" cy="0" r="3.6" fill="#D32F2F"/>
      <circle cx="6" cy="2" r="3.6" fill="#C62828"/>
      <circle cx="2" cy="6" r="3.6" fill="#E53935"/>
      <circle cx="-1" cy="-1.2" r="1.1" fill="#FFCDD2"/>
      <circle cx="5" cy="0.8" r="1.1" fill="#FFCDD2"/>
    </g>
    <!-- palma de cera: tronco claro y penacho -->
    <g id="s-penacho" fill="none" stroke="#1B5E20" stroke-width="3.2" stroke-linecap="round">
      <path d="M0 0 C-10 -2 -20 3 -26 12"/>
      <path d="M0 0 C-9 -10 -20 -12 -28 -8"/>
      <path d="M0 0 C-3 -12 -9 -19 -17 -22"/>
      <path d="M0 0 C4 -12 11 -18 19 -20"/>
      <path d="M0 0 C10 -9 21 -10 28 -5"/>
      <path d="M0 0 C11 -1 20 5 25 13"/>
      <path d="M0 0 C5 5 8 12 8 19" stroke-width="2.6"/>
    </g>
  </defs>

  <!-- aro del sello -->
  <circle cx="160" cy="138" r="127" fill="url(#s-aro)"/>
  <circle cx="160" cy="138" r="121" fill="none" stroke="#F9A825" stroke-width="2.5"/>
  <circle cx="160" cy="138" r="100" fill="#F9A825"/>

  <text font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="13.5" letter-spacing="2.2" fill="#FFF8E1">
    <textPath href="#s-arriba" startOffset="50%" text-anchor="middle">JUNTA DE ACCIÓN COMUNAL</textPath>
  </text>
  <text x="44" y="143" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#FFD54F" text-anchor="middle">★</text>
  <text x="276" y="143" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#FFD54F" text-anchor="middle">★</text>

  <!-- paisaje cultural cafetero del Quindío -->
  <g clip-path="url(#s-disco)">
    <rect x="60" y="38" width="200" height="200" fill="url(#s-cielo)"/>
    <circle cx="204" cy="100" r="38" fill="#FFF3C4" opacity="0.6"/>
    <circle cx="204" cy="100" r="22" fill="url(#s-sol)"/>
    <!-- cordillera con nevado -->
    <path d="M60 152 L100 112 L120 126 L150 90 L176 116 L198 104 L228 128 L260 114 V238 H60 Z" fill="#90A4AE"/>
    <path d="M150 90 L140 101 L145 99.5 L150 104 L155 99 L160 101 Z" fill="#FFFFFF"/>
    <path d="M100 112 L94 118 L100 117 L105 117 Z" fill="#ECEFF1"/>
    <!-- montañas verdes -->
    <path d="M60 170 C90 147 118 151 142 162 C168 148 200 141 260 160 V238 H60 Z" fill="#66BB6A"/>
    <!-- lomas de café con sus surcos -->
    <path d="M60 188 C100 168 140 172 170 183 C200 172 232 169 260 180 V238 H60 Z" fill="#388E3C"/>
    <g fill="none" stroke="#81C784" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 6" opacity="0.9">
      <path d="M66 196 C104 180 140 184 172 193 C202 184 232 182 258 189"/>
      <path d="M64 205 C104 190 142 194 174 202 C204 194 234 192 258 198"/>
      <path d="M62 214 C104 200 144 204 176 211 C206 204 236 202 258 207"/>
    </g>
    <rect x="60" y="218" width="200" height="20" fill="#2E7D32"/>

    <!-- palmas de cera -->
    <path d="M98 220 C97 180 95 132 93 88" fill="none" stroke="#546E7A" stroke-width="7" stroke-linecap="round"/>
    <path d="M98 220 C97 180 95 132 93 88" fill="none" stroke="#ECEFF1" stroke-width="4.6" stroke-linecap="round"/>
    <use href="#s-penacho" transform="translate(93 88) scale(1.4)"/>
    <path d="M225 220 C226 182 227 128 229 80" fill="none" stroke="#546E7A" stroke-width="7" stroke-linecap="round"/>
    <path d="M225 220 C226 182 227 128 229 80" fill="none" stroke="#ECEFF1" stroke-width="4.6" stroke-linecap="round"/>
    <use href="#s-penacho" transform="translate(229 80) scale(1.45)"/>
    <path d="M246 220 C246 196 245 150 244 118" fill="none" stroke="#546E7A" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M246 220 C246 196 245 150 244 118" fill="none" stroke="#ECEFF1" stroke-width="3.4" stroke-linecap="round"/>
    <use href="#s-penacho" transform="translate(244 118) scale(1.05)"/>

    <!-- casa de bahareque, típica del Quindío -->
    <rect x="126" y="178" width="68" height="40" fill="#FFFDE7" stroke="#5D4037" stroke-width="2"/>
    <rect x="126" y="211" width="68" height="7" fill="#2E7D32"/>
    <path d="M118 181 L160 152 L202 181 Z" fill="#C62828" stroke="#8E0000" stroke-width="2" stroke-linejoin="round"/>
    <path d="M130 173 H190 M139 167 H181 M148 161 H172" stroke="#E57373" stroke-width="1.3"/>
    <rect x="153" y="191" width="14" height="27" rx="1" fill="#1565C0" stroke="#0D47A1" stroke-width="1.5"/>
    <circle cx="164" cy="205" r="1.3" fill="#FFD54F"/>
    <rect x="133" y="186" width="13" height="12" fill="#FFCA28" stroke="#5D4037" stroke-width="1.5"/>
    <rect x="174" y="186" width="13" height="12" fill="#FFCA28" stroke="#5D4037" stroke-width="1.5"/>
    <path d="M139.5 186 V198 M133 192 H146 M180.5 186 V198 M174 192 H187" stroke="#5D4037" stroke-width="1"/>
    <path d="M131 201 H148 M172 201 H189" stroke="#7B1FA2" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <circle cx="160" cy="138" r="98" fill="none" stroke="#F9A825" stroke-width="4"/>

  <!-- corona de ramas de café -->
  <g id="s-rama">
    <path d="M150 238 Q 92 232 68 178 Q 57 152 61 116" fill="none" stroke="#5D4037" stroke-width="2.6" stroke-linecap="round"/>
    <use href="#s-hoja" transform="translate(132 236) rotate(160)" fill="#2E7D32"/>
    <use href="#s-hoja" transform="translate(116 232) rotate(-150)" fill="#43A047"/>
    <use href="#s-hoja" transform="translate(98 222) rotate(175)" fill="#2E7D32"/>
    <use href="#s-hoja" transform="translate(86 210) rotate(-120)" fill="#43A047"/>
    <use href="#s-hoja" transform="translate(74 192) rotate(200)" fill="#2E7D32"/>
    <use href="#s-hoja" transform="translate(68 176) rotate(-100)" fill="#43A047"/>
    <use href="#s-hoja" transform="translate(62 156) rotate(215)" fill="#2E7D32"/>
    <use href="#s-hoja" transform="translate(61 136) rotate(-80)" fill="#43A047"/>
    <use href="#s-hoja" transform="translate(61 120) rotate(235)" fill="#2E7D32"/>
    <use href="#s-cerezas" x="106" y="232"/>
    <use href="#s-cerezas" x="76" y="202"/>
    <use href="#s-cerezas" x="62" y="166"/>
  </g>
  <use href="#s-rama" transform="translate(320 0) scale(-1 1)"/>

  <!-- cinta con el nombre del barrio -->
  <path d="M40 233 L14 236 L25 250 L12 265 L46 262 Z" fill="#8E0000"/>
  <path d="M280 233 L306 236 L295 250 L308 265 L274 262 Z" fill="#8E0000"/>
  <path d="M44 258 L48 266 L58 255 Z M276 258 L272 266 L262 255 Z" fill="#5D0000"/>
  <path d="M44 226 Q 160 256 276 226 L 276 258 Q 160 288 44 258 Z" fill="url(#s-cinta)"/>
  <path d="M44 229 Q 160 259 276 229" fill="none" stroke="#FFD54F" stroke-width="1.6"/>
  <path d="M44 255 Q 160 285 276 255" fill="none" stroke="#FFD54F" stroke-width="1.6"/>
  <text font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="17" letter-spacing="1" fill="#FFFFFF">
    <textPath href="#s-cinta-texto" startOffset="50%" text-anchor="middle">LOS PROFESIONALES</textPath>
  </text>
</svg>
